[package]
name = "harness"
version = "0.1.0"
description = "A light desktop app for Claude Code"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name on Windows.
name = "harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" gives child web views: the side panel's browser (see browser.rs).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
base64 = "0.23"
rusqlite = { version = "0.42.0", features = ["bundled"] }
arboard = { version = "3.7.0", default-features = false }
portable-pty = "0.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The browser's screenshots on Mac. Same versions wry already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration", "WKWebViewConfiguration", "WKUserContentController", "WKUserScript"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
