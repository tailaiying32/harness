[package]
name = "tilde"
version = "0.1.0"
description = "A light desktop app for Claude Code"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name on Windows.
name = "tilde_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" gives child web views: the side panel's browser (see browser.rs).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros", "net"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
base64 = "0.23"
rusqlite = { version = "0.42.0", features = ["bundled"] }
arboard = { version = "3.7.0", default-features = false }
portable-pty = "0.9.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
trash = "5.4.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Keeping the computer awake on Windows (keep_awake.rs), the title bar's
# colours (`title_bar` in lib.rs), and whether a process runs (side_chat.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

# The browser's screenshots on Mac, and the Dock icon (`set_app_icon` in lib.rs). Same versions wry already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration", "WKWebViewConfiguration", "WKUserContentController", "WKUserScript"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
